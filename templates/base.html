<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Audio Transcriber{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary: #0f172a;
            --primary-light: #1e293b;
            --accent: #06b6d4;
            --accent-hover: #22d3ee;
            --accent-soft: rgba(6, 182, 212, 0.12);
            --success: #10b981;
            --success-soft: rgba(16, 185, 129, 0.12);
            --error: #ef4444;
            --error-soft: rgba(239, 68, 68, 0.12);
            --info: #3b82f6;
            --info-soft: rgba(59, 130, 246, 0.12);
            --bg: #f8fafc;
            --bg-card: #ffffff;
            --border: #e2e8f0;
            --text: #0f172a;
            --text-muted: #64748b;
            --radius: 12px;
            --radius-lg: 16px;
            --shadow: 0 1px 3px rgba(0,0,0,0.06);
            --shadow-lg: 0 10px 40px -15px rgba(0,0,0,0.12);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
            background: linear-gradient(180deg, #f8fafc 0%, #f1f5f9 100%);
            min-height: 100vh;
            color: var(--text);
            line-height: 1.6;
        }

        .navbar {
            background: rgba(255,255,255,0.9);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            padding: 0 24px;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .nav-inner {
            max-width: 1100px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 64px;
        }
        .brand {
            display: flex;
            align-items: center;
            gap: 14px;
            text-decoration: none;
            color: var(--text);
        }
        .brand .logo {
            width: 42px;
            height: 42px;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--accent) 0%, #0891b2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 800;
            font-size: 18px;
        }
        .brand .name {
            font-weight: 700;
            font-size: 1.15rem;
        }
        .brand .tagline {
            font-size: 0.75rem;
            color: var(--text-muted);
            font-weight: 500;
        }
        .nav-links {
            display: flex;
            gap: 6px;
        }
        .nav-links a {
            padding: 8px 16px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 500;
            font-size: 0.9rem;
            color: var(--text-muted);
            transition: all 0.2s;
        }
        .nav-links a:hover {
            color: var(--accent);
            background: var(--accent-soft);
        }
        .nav-links a.active {
            color: var(--accent);
            background: var(--accent-soft);
        }

        .container {
            max-width: 720px;
            margin: 0 auto;
            padding: 40px 24px 60px;
        }

        .page-header {
            margin-bottom: 28px;
        }
        .page-header h1 {
            font-size: 1.75rem;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 6px;
        }
        .page-header p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .card {
            background: var(--bg-card);
            border-radius: var(--radius-lg);
            padding: 28px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
        }

        .form-group {
            margin-bottom: 18px;
        }
        .form-group label {
            display: block;
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--text);
            margin-bottom: 8px;
        }
        .form-control {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--border);
            border-radius: 10px;
            font-size: 15px;
            font-family: inherit;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .form-control:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-soft);
        }
        .form-control::placeholder {
            color: #94a3b8;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 20px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 0.95rem;
            border: none;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.2s;
            text-decoration: none;
        }
        .btn-primary {
            background: linear-gradient(135deg, var(--accent) 0%, #0891b2 100%);
            color: white;
        }
        .btn-primary:hover:not(:disabled) {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(6, 182, 212, 0.4);
        }
        .btn-secondary {
            background: var(--primary);
            color: white;
        }
        .btn-secondary:hover:not(:disabled) {
            background: var(--primary-light);
            transform: translateY(-1px);
        }
        .btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .status {
            padding: 12px 16px;
            border-radius: 10px;
            font-weight: 500;
            margin-top: 12px;
        }
        .status.info { background: var(--info-soft); color: #1d4ed8; }
        .status.success { background: var(--success-soft); color: #047857; }
        .status.error { background: var(--error-soft); color: #b91c1c; }

        .loading {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .radio-group {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
        }
        .radio-option {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 18px;
            border: 1px solid var(--border);
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .radio-option:hover { border-color: var(--accent); }
        .radio-option:has(input:checked) {
            border-color: var(--accent);
            background: var(--accent-soft);
        }
        .radio-option input:checked + span { color: var(--accent); font-weight: 600; }
        .radio-option input { display: none; }

        .file-upload-zone {
            border: 2px dashed var(--border);
            border-radius: 10px;
            padding: 24px;
            text-align: center;
            transition: all 0.2s;
            cursor: pointer;
        }
        .file-upload-zone:hover {
            border-color: var(--accent);
            background: var(--accent-soft);
        }
        .file-upload-zone input[type="file"] { display: none; }

        .output-box {
            background: #f8fafc;
            border-radius: 10px;
            padding: 16px;
            margin-top: 16px;
            border: 1px solid var(--border);
            white-space: pre-wrap;
            font-size: 0.95rem;
        }

        footer {
            text-align: center;
            padding: 24px;
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        @media (max-width: 640px) {
            .nav-links { gap: 4px; }
            .nav-links a { padding: 8px 12px; font-size: 0.85rem; }
            .container { padding: 24px 16px 40px; }
        }
    </style>
    {% block head %}{% endblock %}
</head>
<body>
    <nav class="navbar">
        <div class="nav-inner">
            <a href="/" class="brand">
                <div class="logo"><i class="fas fa-wave-square"></i></div>
                <div>
                    <div class="name">Audio Transcriber</div>
                    <div class="tagline">Transcribe • Search • Answer</div>
                </div>
            </a>
            <div class="nav-links">
                <a href="/" class="{% if request.path == '/' or request.path == '/download' %}active{% endif %}"><i class="fas fa-microphone"></i> Transcribe</a>
                <a href="/process" class="{% if request.path == '/process' %}active{% endif %}"><i class="fas fa-cogs"></i> Process</a>
                <a href="/qa" class="{% if request.path == '/qa' %}active{% endif %}"><i class="fas fa-comments"></i> Q&A</a>
                <a href="/summary" class="{% if request.path == '/summary' %}active{% endif %}"><i class="fas fa-file-lines"></i> Summary</a>
            </div>
        </div>
    </nav>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <footer>© 2025 Audio Transcriber — AI-powered transcription & Q&A</footer>
    {% block scripts %}{% endblock %}
</body>
</html>
